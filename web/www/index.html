<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Viewer</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <script src="js/jquery-3.6.0.js"></script>
    <script src="js/socket.io.js"></script>

</head>

<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-4 p-0">
                <input type="text" class="form-control terminalId" placeholder="Please enter the terminal id" value=1>
            </div>
            <div class="col-4">
                <button class="btn btn-success getScreenList"> > </button>
            </div>
        </div>
        <div class="row mt-1 listOfScreensAndWindows">
        </div>
        <div class="row">
            <canvas id="myCanvas"></canvas>
        </div>
        <div class="row">
            <img id="screenShot">
        </div>
    </div>
</body>

</html>

<script src="js/screenViewer.js"></script>
