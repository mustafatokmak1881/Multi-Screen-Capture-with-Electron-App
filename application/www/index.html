<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script
      type="text/javascript"
      src="js/webcam-easy.min.js"
    ></script>
  </head>
  <body>
    <img id="pic" width="100px" height="100px" />
    <video id="webcam" autoplay playsinline width="80" height="60"></video>
    <canvas id="canvas" class="d-none"></canvas>
    <audio id="snapSound" src="audio/snap.wav" preload="auto"></audio>
    
    <!-- Audio stream için elementler -->
    <div id="audioControls" style="display: none;">
      <audio id="audioInput" autoplay muted></audio>
      <canvas id="audioCanvas" width="1024" height="1"></canvas>
    </div>
    
  </body>

  <script src="js/index.js"></script>
</html>
